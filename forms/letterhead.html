<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>سربرگ رسمی — رایانش هوشمند ابر رها</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    />
    <style>
      :root {
        --saffron: #e56b0e;
        --amber: #f5a021;
        --honey: #fdd456;
        --sage: #799f55;
        --silver: #bbc4b0;
        --ink: #1a1a1a;
        --muted: #5a5a5a;
        --paper: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        font-family: "Vazirmatn", "Vazir", Tahoma, sans-serif;
        background: #e9eaee;
        color: var(--ink);
        direction: rtl;
      }

      .page {
        position: relative;
        width: 210mm;
        height: 297mm;
        margin: 16px auto;
        background: var(--paper);
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }

      /* ===== Decorative top bar ===== */
      .top-bar {
        position: absolute;
        top: 0;
        right: 0;
        width: 100%;
        height: 70px;
        background: linear-gradient(
          270deg,
          var(--saffron) 0%,
          var(--amber) 60%,
          var(--honey) 100%
        );
        border-bottom-left-radius: 60px 40px;
      }
      .top-bar::after {
        content: "";
        position: absolute;
        bottom: -14px;
        left: 0;
        right: 120px;
        height: 14px;
        background: linear-gradient(270deg, var(--amber), var(--honey));
        opacity: 0.55;
        border-bottom-left-radius: 40px 14px;
      }

      /* ===== Right vertical accent ===== */
      .right-accent {
        position: absolute;
        right: 0;
        top: 70px;
        bottom: 110px;
        width: 14px;
        background: linear-gradient(180deg, var(--amber), var(--saffron));
      }

      /* ===== Logo circle (top-right) ===== */
      .logo-mark {
        position: absolute;
        top: 14px;
        right: 30px;
        width: 175px;
        height: 175px;
        border-radius: 50%;
        background: var(--paper);
        border: 3px dashed var(--saffron);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px rgba(229, 107, 14, 0.18);
        padding: 16px 12px 14px;
        z-index: 2;
      }
      .logo-mark::before {
        content: "";
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        border: 2px solid var(--amber);
        pointer-events: none;
      }
      .logo-mark img {
        width: 78%;
        height: auto;
        object-fit: contain;
        margin-top: 2px;
      }
      .logo-mark .brand {
        margin-top: 4px;
        font-size: 10.5pt;
        font-weight: 700;
        color: var(--saffron);
        text-align: center;
        line-height: 1.3;
        letter-spacing: 0.2px;
      }

      /* ===== Dashed inner border ===== */
      .inner-border {
        position: absolute;
        top: 86px;
        bottom: 110px;
        left: 28px;
        right: 28px;
        border: 1.5px dashed #b8b8b8;
        pointer-events: none;
      }

      /* ===== Form meta (date / number / attachments) ===== */
      .meta {
        position: absolute;
        top: 110px;
        left: 50px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 12pt;
        color: var(--ink);
      }
      .meta .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .meta .label {
        width: 60px;
        font-weight: 700;
      }
      .meta .field {
        min-width: 180px;
        border-bottom: 1px dotted #999;
        padding: 2px 6px;
        min-height: 18px;
      }

      /* ===== Body content area ===== */
      .body {
        position: absolute;
        top: 250px;
        bottom: 150px;
        left: 56px;
        right: 56px;
        font-size: 12pt;
        line-height: 2;
        text-align: justify;
        color: var(--ink);
      }
      .body .ruled {
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 31px,
          #ececec 31px,
          #ececec 32px
        );
        height: 100%;
      }

      /* ===== Footer ===== */
      .footer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 110px;
        padding: 18px 56px 18px 56px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10.5pt;
        color: var(--ink);
        border-top: 1px solid #eee;
      }
      .footer::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(
          90deg,
          var(--saffron),
          var(--amber),
          var(--honey),
          var(--sage),
          var(--silver)
        );
      }
      .footer .col {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .footer .col.left {
        text-align: left;
        direction: ltr;
      }
      .footer .item {
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }
      .footer .icon {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
        border-radius: 50%;
        background: var(--saffron);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
      }

      /* ===== Watermark ===== */
      .watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-22deg);
        width: 380px;
        opacity: 0.045;
        pointer-events: none;
        user-select: none;
      }
      .watermark img {
        width: 100%;
        height: auto;
      }

      /* ===== Print rules ===== */
      @page {
        size: A4;
        margin: 0;
      }
      @media print {
        html,
        body {
          background: #fff;
        }
        .page {
          margin: 0;
          box-shadow: none;
          page-break-after: always;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <!-- decorative top bar -->
      <div class="top-bar"></div>

      <!-- right accent strip -->
      <div class="right-accent"></div>

      <!-- inner dashed border -->
      <div class="inner-border"></div>

      <!-- watermark logo -->
      <div class="watermark">
        <img src="../logo/logo.png" alt="" />
      </div>

      <!-- logo circle -->
      <div class="logo-mark">
        <img src="../logo/logo-fa.png" alt="رایانش هوشمند ابر رها" />
      </div>

      <!-- form meta fields -->
      <div class="meta">
        <div class="row">
          <span class="label">تاریخ:</span>
          <span class="field"></span>
        </div>
        <div class="row">
          <span class="label">شماره:</span>
          <span class="field"></span>
        </div>
        <div class="row">
          <span class="label">پیوست:</span>
          <span class="field"></span>
        </div>
      </div>

      <!-- body -->
      <div class="body">
        <div class="ruled"></div>
      </div>

      <!-- footer -->
      <div class="footer">
        <!-- right column: address & phone (Persian) -->
        <div class="col right">
          <div class="item">
            <span class="icon">◉</span>
            <span>تهران، کوچه آرمان، کوچه برادران احمدی، پلاک ۱۲، واحد ۳</span>
          </div>
          <div class="item">
            <span class="icon">☎</span>
            <span>۰۲۱۶۶۵۷۲۴۸۱</span>
          </div>
        </div>

        <!-- left column: email & website (Latin) -->
        <div class="col left">
          <div class="item">
            <span>info@rahacloud.com</span>
            <span class="icon">✉</span>
          </div>
          <div class="item">
            <span>rahacloud.com</span>
            <span class="icon">🌐</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
